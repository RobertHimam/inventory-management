version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: inventory-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - inventory-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")', '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: inventory-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - inventory-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: inventory-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/auth?authSource=admin
      AUTH_DB: auth
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-32chars+}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: inventory-product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/products?authSource=admin
      PRODUCT_DB: products
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: inventory-inventory-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/inventory?authSource=admin
      INVENTORY_DB: inventory
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  report-service:
    build:
      context: .
      dockerfile: apps/report-service/Dockerfile
    container_name: inventory-report-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/reports?authSource=admin
      REPORT_DB: reports
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: inventory-notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/notifications?authSource=admin
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  audit-service:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    container_name: inventory-audit-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/audit?authSource=admin
      AUDIT_DB: audit
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      RABBITMQ_DLQ_SUFFIX: .dlq
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventory-network

  sse-service:
    build:
      context: .
      dockerfile: apps/sse-service/Dockerfile
    container_name: inventory-sse-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: inventory.events
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - inventory-network

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: inventory-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      PRODUCT_SERVICE_URL: http://product-service:3000
      INVENTORY_SERVICE_URL: http://inventory-service:3000
      REPORT_SERVICE_URL: http://report-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      AUDIT_SERVICE_URL: http://audit-service:3000
      SSE_SERVICE_URL: http://sse-service:3000
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/gateway?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars+}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      report-service:
        condition: service_started
      notification-service:
        condition: service_started
      audit-service:
        condition: service_started
      sse-service:
        condition: service_started
    networks:
      - inventory-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # VITE_API_URL is embedded at BUILD time by vite define()
        # Points to the gateway port exposed on the host
        VITE_API_URL: http://localhost:3000
    container_name: inventory-frontend
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - gateway
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:
